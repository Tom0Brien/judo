defaults:
  - tune_default

node_definitions:
  tuner:
    _target_: judo.app.tune.TunerNode
    node_id: tuner
    max_workers: null
    n_trials: 30
    n_samples_per_trial: 10
    target_task: cartpole
    target_optimizer: mppi
    objective: reward  # optimize for task performance
    reward_weight: 1.0
    plan_time_weight: 1.0
    trial_duration: 15.0  # longer trials for reward accumulation
    study_name: "cartpole_reward_optimization"
    storage: "sqlite:///cartpole_reward_tuning.db"
